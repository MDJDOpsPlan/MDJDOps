# One-way sync: SRC-ORG/REPO (private, maryland-judiciary EMU) -> PUBLIC-ORG/REPO (public, outside the enterprise)
# Syncs main and all tags. Other branches stay private.
# Auth: GitHub App owned by PUBLIC-ORG, installed on PUBLIC-ORG/REPO only.
#       Each run mints a 1-hour installation token limited to Contents + Workflows on that one repo.
#
# Before committing, replace the hardcoded values:
#   SRC-ORG/REPO    -> the private EMU repo                      (the "if:" line)
#   APP-ID          -> the App's numeric App ID (not a secret) (app-id)
#   PUBLIC-ORG      -> the public org                            (owner, and push URL)
#   PUBLIC-REPO     -> the public repo name                      (repositories, and push URL)
#
# Requires repo secret PUBLIC_MIRROR_APP_KEY = contents of the App's .pem private key.
#
# Save as .github/workflows/public-mirror.yml in SRC-ORG/REPO.

name: Sync to public mirror

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-mirror
  cancel-in-progress: false

jobs:
  mirror:
    # This file is mirrored to the public repo too; this guard keeps it from running there.
    if: github.repository == 'Maryland-Judiciary/MDOpsPlan'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history (all branches and tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint short-lived token for the public repo
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: 5631006
          private-key: ${{ secrets.PUBLIC_MIRROR_APP_KEY }}
          owner: MDJDOpsPlan
          repositories: MDJDOps
          permission-contents: write
          permission-workflows: write

      - name: Push main and tags to public repo
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push https://github.com/MDJDOpsPlan/MDJDOps.git \
            'refs/remotes/origin/main:refs/heads/main' \
            'refs/tags/*:refs/tags/*'
